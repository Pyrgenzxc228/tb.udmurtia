services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: tb_registry
      POSTGRES_USER: tb
      POSTGRES_PASSWORD: tb
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tb -d tb_registry"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data: