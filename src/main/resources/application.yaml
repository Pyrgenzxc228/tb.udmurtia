spring:
  application:
    name: tb-registry

  datasource:
    url: jdbc:postgresql://localhost:5432/tb_registry
    username: tb
    password: tb

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    ru.udmurtia.tb: DEBUG